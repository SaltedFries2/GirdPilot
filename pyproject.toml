[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpilot"
version = "0.0.1"
description = "Experimental IEC 61850 BESS configuration validation scaffold"
requires-python = ">=3.10"
authors = [{name = "GridPilot contributors"}]

[project.scripts]
gridpilot = "gridpilot.cli:main"

[tool.setuptools.packages.find]
include = ["gridpilot*"]
